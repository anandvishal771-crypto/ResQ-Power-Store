name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Prepare Web Assets for Capacitor
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          else
            HTML_FILE=$(find . -maxdepth 3 -name "*.html" ! -path "./node_modules/*" ! -path "./android/*" | head -n 1)
            if [ -z "$HTML_FILE" ]; then
              echo "No HTML file found in repository."
              exit 1
            fi
            cp "$HTML_FILE" www/index.html
          fi

      - name: Initialize Capacitor & Add Android Platform
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "ResQ Power Store" "com.resqpower.storeregister" --web-dir=www
          npx cap add android
          npx cap copy android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResQ-Power-Store-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

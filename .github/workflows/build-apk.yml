name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Move Web Files to www
        run: |
          mkdir -p www
          mv index.html www/ 2>/dev/null || true
          mv style.css www/ 2>/dev/null || true
          mv script.js www/ 2>/dev/null || true
          mv app.js www/ 2>/dev/null || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android App
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "ResQPowerStore" "com.resq.powerstore" --web-dir=www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ResQ-Power-Store-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
